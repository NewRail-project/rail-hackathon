<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewRail · Локомотивный парк</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="hud-wrapper">
        <header class="brand-header">
            <h1>NewRail · Локомотивный парк</h1>
        </header>

        <nav class="train-nav">
            <a href="../index.html" class="wagon">Обзор</a>
            <a href="park.html" class="wagon active">Парк</a>
            <a href="diagnostics.html" class="wagon">Диагностика</a>
            <a href="journal.html" class="wagon">Журнал</a>
            <a href="repair.html" class="wagon">Ремонт</a>
            <a href="qr.html" class="wagon">QR</a>
            <span class="train-head" aria-hidden="true"></span>
        </nav>

        <main id="content-area">Загрузка...</main>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../js/data.js"></script>
    <script type="module">
        import { USE_DEMO, demoLocomotives, statusLabels } from "../js/demo.js";
        import { listenRecords } from "../js/data.js";

        const area = document.getElementById("content-area");

        // фильтр из URL (например ?filter=warning)
        const urlParams = new URLSearchParams(location.search);
        let activeFilter = urlParams.get("filter") || "all";
        let searchQuery = "";
        let all = [];

        function statusPct(l) {
          return Math.min(100, Math.round(((l.mileage || 0) / (l.next_to || 1)) * 100));
        }

        function badgeOf(status) {
          const map = {
            ok:       ["done",    "В норме"],
            warning:  ["progress","Требует проверки"],
            critical: ["waiting", "Критично"],
            nodata:   ["nodata",  "Нет данных"]
          };
          const [cls, label] = map[status] || map.nodata;
          return `<span class="badge ${cls}">${label}</span>`;
        }

        function render() {
          let data = all.slice();

          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            data = data.filter(l =>
              (l.id || "").toLowerCase().includes(q) ||
              (l.inventory || "").toLowerCase().includes(q) ||
              (l.model || "").toLowerCase().includes(q)
            );
          }

          if (activeFilter !== "all") {
            if (activeFilter === "warning") {
              data = data.filter(l => l.status === "warning" || l.status === "critical");
            } else {
              data = data.filter(l => l.status === activeFilter);
            }
          }

          const cards = data.length
            ? data.map(l => {
                const pct = statusPct(l);
                return `
                  <div class="loco-card ${l.status}" onclick="location.href='loco.html?id=${encodeURIComponent(l.id)}'">
                    <div class="num">${l.id}</div>
                    <div class="meta">${l.model || "—"} · инв. ${l.inventory || "—"}</div>
                    ${badgeOf(l.status)}
                    <div class="mileage">Пробег: ${(l.mileage||0).toLocaleString("ru-RU")} км</div>
                    <div class="progress" style="margin-top:6px">
                      <div class="progress-fill" style="width:${pct}%"></div>
                    </div>
                    <div class="mileage" style="text-align:right">${pct}% до ТО</div>
                  </div>
                `;
              }).join("")
            : '<div class="empty">Ничего не найдено</div>';

          area.innerHTML = `
            <div class="card">
              <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
                <input id="search" placeholder="Поиск по номеру / модели / инв." style="flex:1;min-width:200px" value="${searchQuery}">
                <select id="filter" style="max-width:220px">
                  <option value="all">Все статусы</option>
                  <option value="ok">В норме</option>
                  <option value="warning">Требует проверки</option>
                  <option value="critical">Критично</option>
                  <option value="nodata">Нет данных</option>
                </select>
              </div>
            </div>
            <div class="loco-grid">${cards}</div>
          `;

          const sel = document.getElementById("filter");
          sel.value = activeFilter;
          sel.onchange = () => { activeFilter = sel.value; render(); };

          const inp = document.getElementById("search");
          inp.oninput = () => { searchQuery = inp.value; render(); };
        }

        if (USE_DEMO) {
          all = demoLocomotives;
          render();
        } else {
          listenRecords("locomotives", d => { all = d; render(); });
        }
    </script>
</body>
</html>
