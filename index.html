const NMAP={},NIDX={};let _i=0;NODES.forEach(g=>g.items.forEach(([k,n])=>{NMAP[k]={k,n,g:g.g};NIDX[k]=_i++}));

const AI_PROVIDERS=[{name:'Pollinations',url:'https://text.pollinations.ai/openai',model:'openai',key:false},{name:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',model:AI_MODEL,key:true}];
async function aiChat(messages){let last;for(const p of AI_PROVIDERS){if(p.key&&!AIKEY)continue;const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(p.url,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',...(p.key?{Authorization:'Bearer '+AIKEY}:{})},body:JSON.stringify({model:p.model,temperature:.2,messages})});
   const j=await r.json();if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||r.status);return{text:j.choices[0].message.content,name:p.name+' · '+p.model}}
  catch(e){last=e}finally{clearTimeout(tm)}}throw last||new Error('нет доступного ИИ-провайдера')}

let POP=null;
function closePop(){if(POP){POP.el.remove();POP.owner.classList.remove('open');POP=null}}
function place(o,el){const r=o.getBoundingClientRect(),h=el.offsetHeight,below=innerHeight-r.bottom,up=below<Math.min(h,240)+12&&r.top>below;el.style.minWidth=r.width+'px';el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-8))+'px';el.style.maxHeight=Math.max(160,(up?r.top:below)-16)+'px';el.style.top=(up?Math.max(8,r.top-Math.min(h,r.top-16)-4):r.bottom+4)+'px'}
function openPop(owner,el){closePop();el.classList.add('pop');document.body.appendChild(el);POP={el,owner};owner.classList.add('open');place(owner,el)}
document.addEventListener('mousedown',e=>{if(POP&&!POP.el.contains(e.target)&&!POP.owner.contains(e.target))closePop()});
window.addEventListener('scroll',e=>{if(POP&&!POP.el.contains(e.target))closePop()},true);window.addEventListener('resize',closePop);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&POP){closePop();e.stopPropagation()}},true);
const uiOf=el=>el.dataset&&el.dataset.cs?el.nextElementSibling:el.dataset&&el.dataset.dp?el.previousElementSibling:el;

function enhanceSelects(root){root.querySelectorAll('select:not([data-cs])').forEach(s=>{
 s.dataset.cs=1;s.style.display='none';
 const w=document.createElement('div');w.className='cs'+(s.classList.contains('inl')?' inl':'');
 w.innerHTML='<button type="button" class="cs-btn"><span class="cs-v"></span><i class="cs-ar"></i></button>';s.after(w);
 const lab=()=>{const o=s.options[s.selectedIndex];w.querySelector('.cs-v').innerHTML=o&&o.text?esc(o.text):'<span class="nd">Не выбрано</span>'};lab();
 s.addEventListener('change',lab);
 w.querySelector('button').onclick=()=>{if(POP&&POP.owner===w)return closePop();
  const l=document.createElement('div');l.className='cs-list';
  l.innerHTML=[...s.options].map((o,i)=>`<div class="cs-opt${i===s.selectedIndex?' sel':''}" data-i="${i}">${o.text?esc(o.text):'<span class="nd">Не выбрано</span>'}</div>`).join('');
  l.onclick=e=>{const t=e.target.closest('.cs-opt');if(!t)return;s.selectedIndex=+t.dataset.i;s.dispatchEvent(new Event('change',{bubbles:true}));closePop()};
  openPop(w,l);const sel=l.querySelector('.sel');if(sel)sel.scrollIntoView({block:'nearest'})}})}

const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function enhanceDates(root){root.querySelectorAll('input[type=date]:not([data-dp])').forEach(inp=>{
 const v0=inp.value;inp.dataset.dp=1;inp.type='hidden';inp.value=v0;
 const w=document.createElement('div');w.className='dp';w.innerHTML='<button type="button" class="cs-btn"><span class="cs-v"></span><i class="cs-cal"></i></button>';inp.before(w);
 const lab=()=>{w.querySelector('.cs-v').innerHTML=inp.value?esc(inp.value.split('-').reverse().join('.')):'<span class="nd">дд.мм.гггг</span>'};lab();
 w.querySelector('button').onclick=()=>{if(POP&&POP.owner===w)return closePop();
  let [y,m]=(inp.value||todayISO()).split('-').map(Number);m--;const el=document.createElement('div');el.className='dp-pop';
  const draw=()=>{const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),sel=inp.value,t=todayISO();let c='';for(let i=0;i<first;i++)c+='<span></span>';
   for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;c+=`<button type="button" class="dp-d${iso===sel?' sel':''}${iso===t?' today':''}" data-d="${iso}">${d}</button>`}
   el.innerHTML=`<div class="dp-h"><button type="button" data-n="-1">‹</button><b>${MN[m]} ${y}</b><button type="button" data-n="1">›</button></div><div class="dp-g">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<i>${x}</i>`).join('')}${c}</div><div class="dp-f"><button type="button" data-d="${t}">Сегодня</button><button type="button" data-d="">Очистить</button></div>`};
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.n){m+=+b.dataset.n;if(m<0){m=11;y--}if(m>11){m=0;y++}draw();return}
   if(b.dataset.d!==undefined){inp.value=b.dataset.d;inp.dispatchEvent(new Event('change',{bubbles:true}));lab();closePop()}};
  draw();openPop(w,el)}})}
const enhance=root=>{enhanceSelects(root);enhanceDates(root)};

function nodePicker(name,sel=[],type=''){return`<div class="npick">${NODES.map(g=>`<div class="ng" data-for="${g.f}"${hideGroup(g,type)?' hidden':''}><div class="ng-t">${esc(g.g)}${g.f==='e'?' · электровозы':g.f==='d'?' · тепловозы':''}</div><div class="ng-c">${g.items.map(([k,n])=>`<label class="nchip"><input type="checkbox" name="${name}" value="${k}" ${sel.includes(k)?'checked':''}><span>${esc(n)}</span></label>`).join('')}</div></div>`).join('')}</div>`}
const pickedNodes=(root,name)=>[...root.querySelectorAll(`.ng:not([hidden]) input[name="${name}"]:checked`)].map(i=>i.value);
function fieldHTML(f){const v=f.value??'';let c;
 if(f.type==='select')c=`<select name="${f.name}">${f.options.map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
 else if(f.type==='area')c=`<textarea name="${f.name}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
 else if(f.type==='nodes')c=nodePicker(f.name,f.value||[],f.nodeType);
 else c=`<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" autocomplete="off">`;
 return`<div class="field"><label>${esc(f.label||'')}${f.req?' *':''}</label>${c}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`}
function dlg(o){return new Promise(res=>{const fields=o.fields||[],bg=document.createElement('div');bg.className='dlg-bg';
 bg.innerHTML=`<form class="dlg ${o.danger?'danger-d':''}" novalidate><h2>${esc(o.title)}</h2>${o.sub?`<div class="subtitle">${esc(o.sub)}</div>`:''}${o.text?`<p class="dlg-text">${esc(o.text)}</p>`:''}${fields.map(fieldHTML).join('')}<div class="dlg-act"><button type="button" data-x="c">${esc(o.cancel||'Отмена')}</button><button class="${o.danger?'danger':'primary'}">${esc(o.ok||'Готово')}</button></div></form>`;
 document.body.appendChild(bg);enhance(bg);const f=bg.querySelector('form');
 const kd=e=>{if(e.key==='Escape')close(null)},close=v=>{closePop();document.removeEventListener('keydown',kd);bg.remove();res(v)};document.addEventListener('keydown',kd);
 bg.addEventListener('mousedown',e=>{if(e.target===bg)close(null)});f.querySelector('[data-x=c]').onclick=()=>close(null);
 f.onsubmit=e=>{e.preventDefault();let bad=false;
  fields.forEach(x=>{if(x.type==='nodes')return;const el=f.elements[x.name],empty=!String(el.value).trim();if(x.req&&empty)bad=true;uiOf(el).classList.toggle('invalid',!!x.req&&empty)});
  if(bad)return toast('Заполните обязательные поля','error');
  const v={};fields.forEach(x=>{v[x.name]=x.type==='nodes'?pickedNodes(f,x.name):String(f.elements[x.name].value).trim()});
  const m=o.validate&&o.validate(v);if(m)return toast(m,'error');close(v)};
 setTimeout(()=>{const i=f.querySelector('input:not([type=hidden]):not([type=checkbox]),textarea');if(i)i.focus()},60)})}

let S={v:'list',id:null,cid:null,wc:null,eqf:false},locoSubs=[],caseSubs=[],lastSync=null,AIKEY='';
const watch=(name,key,f,val)=>onSnapshot(f?query(collection(db,name),where(f,'==',val)):collection(db,name),s=>{D[key]=s.docs.map(d=>({id:d.id,...d.data()}));lastSync=now();render()},e=>{$('live').textContent='ошибка: '+e.code;toast(name+': '+e.code,'error')});

async function submitIntake(e){e.preventDefault();const fm=e.target,f=Object.fromEntries(new FormData(fm));delete f.node;

 if(l&&mil<(l.mileage||0)){const v=await dlg({title:'Пробег меньше сохранённого',sub:'Сохранено: '+km(l.mileage),fields:[{name:'c',label:'Причина корректировки',type:'area',req:true}],ok:'Продолжить'});if(!v)return;cm=v.c}
 if(!l){const r=await addDoc(collection(db,'locomotives'),{number:f.number,series:f.series,type:f.type,factoryNo:f.factoryNo,year:f.year,depot:f.depot,org:f.org,rep:f.rep,mileage:mil,mileageDate:f.mileageDate,lastTO:f.lastTO,lastTOType:f.lastTOType,prevRepair:f.prevRepair,createdAt:now()}).catch(err);if(!r)return;id=r.id}
 else await upd('locomotives',id,{mileage:mil,mileageDate:f.mileageDate||l.mileageDate});
 await add('mileageReadings',{locoId:id,value:mil,date:f.mileageDate,ts:now(),source:'анкета заказчика',by:f.rep,comment:cm});
 await ensureNodes(id,f.type||(l&&l.type)||'',keys,f.rep);
 const n=D.cases.filter(c=>c.locoId===id).length+1,c=await addDoc(collection(db,'maintenanceCases'),{locoId:id,locoNumber:f.number,org:f.org,caseNo:n,reason:f.reason,intake:f,stage:'created',planApproved:false,createdAt:now(),updatedAt:now()}).catch(err);
 if(c)await add('statusHistory',{caseId:c.id,from:'',to:'created',ts:now(),comment:'Анкета подтверждена',by:f.rep});

 try{$('org').value=f.org;localStorage.org=f.org}catch(_){}toast('Паспорт и ремонтный случай созданы','success');openLoco(id)}

async function ensureNodes(id,type,sel=[],by='',o={}){
 const reason=o.reason||'Заявлено заказчиком при сдаче',to=o.to||'check',okFrom=o.force?s=>!['defect','repair','inrepair'].includes(s):s=>['unknown','ok','fixed'].includes(s);
 try{const ex=(await getDocs(query(collection(db,'equipment'),where('locoId','==',id)))).docs.map(d=>({id:d.id,...d.data()})),have=new Map(ex.filter(e=>e.key).map(e=>[e.key,e])),b=writeBatch(db);let n=0;
  const type2=type||'';
  for(const [g,k,name] of nodesFor(type2)){const e=have.get(k),pick=sel.includes(k),h={from:e?e.state:'unknown',to,ts:now(),reason,by};
   if(!e){b.set(doc(collection(db,'equipment')),{locoId:id,key:k,group:g,name,state:pick?to:'unknown',history:pick?[h]:[],createdAt:now()});n++}
   else if(pick&&okFrom(e.state)){b.update(doc(db,'equipment',e.id),{state:to,history:arrayUnion(h)});n++}}
  if(n)await b.commit();return n}catch(e){err(e);return 0}}
const eqRow=(q,dep)=>{const svc=[q.svcCode,q.svcDate,q.svcMileage!=null&&q.svcMileage!==''?km(q.svcMileage):''].filter(Boolean).join(' · '),h=(q.history||[]),lh=h[h.length-1];
 return`<div class="nrow"><div><div class="nname">${esc(q.name)}</div><div class="meta">Последнее обслуживание: ${svc?esc(svc):'<span class="nd">нет данных</span>'}</div>${q.note?`<div class="meta">Примечание: ${esc(q.note)}</div>`:''}${lh?`<div class="meta">Изменений состояния: ${h.length} · последнее: ${esc(lh.reason)} (${fmt(lh.ts)})</div>`:''}</div><div class="nact"><span class="badge ${EQC[q.state]||'unk'}">${EQ[q.state]||'—'}</span>${dep?`<button data-a="eqe" data-id="${q.id}">Изменить</button>`:''}</div></div>`};
function eqCard(l,dep){const eq=[...D.equipment].sort((a,b)=>(NIDX[a.key]??999)-(NIDX[b.key]??999)),tot=eq.length,n=f=>eq.filter(q=>f(q.state)).length,
 ok=n(s=>['ok','fixed'].includes(s)),bad=n(s=>BAD.includes(s)),crit=n(s=>['defect','repair'].includes(s)),unk=tot-ok-bad,missing=nodesFor(l.type).filter(([,k])=>!eq.some(q=>q.key===k)).length;
 const verdict=!tot?'Узлы не внесены. Отсутствие записей не означает исправность.':crit?`Есть неисправные узлы: ${crit}`:bad?`Есть узлы, требующие проверки или ремонта: ${bad}`:unk===tot?'Состояние узлов пока не установлено':unk?`Проверено ${tot-unk} из ${tot} узлов, замечаний нет`:'По всем узлам замечаний нет';
 const stat=(t,v,c='')=>`<div class="stat"><div class="label">${t}</div><div class="value ${c}">${v}</div></div>`;
 const rows=S.eqf?eq.filter(q=>BAD.includes(q.state)):eq,gn=q=>{const g=(q.key&&NMAP[q.key]?NMAP[q.key].g:q.group)||'Прочее';return NODES.some(x=>x.g===g)?g:'Прочее'};
 const body=[...NODES.map(g=>g.g),'Прочее'].map(g=>{const xs=rows.filter(q=>gn(q)===g);return xs.length?`<h3 class="sec">${esc(g)}</h3>`+xs.map(q=>eqRow(q,dep)).join(''):''}).join('');
 return`<div class="card"><h2>Общее состояние узлов</h2><div class="verdict">${verdict}</div>${tot?`<div class="grid grid-4" style="margin:12px 0">${stat('Всего узлов',tot)}${stat('В норме',ok,'green')}${stat('Требуют внимания',bad,crit?'red':'yellow')}${stat('Не проверено',unk)}</div>`:''}
 <div class="actions" style="margin:0 0 6px">${tot?`<button data-a="eqf">${S.eqf?'Показать все узлы':'Только проблемные'}</button>`:''}${dep?`<button class="primary" data-a="faults">Отметить, где поломка</button>`:''}${dep&&missing?`<button data-a="fillnodes">+ Добавить недостающие узлы (${missing})</button>`:''}</div>
 ${body||(tot?'<div class="empty">Проблемных узлов нет</div>':'')}</div>`}

const compress=file=>new Promise((ok,bad)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{URL.revokeObjectURL(u);let s=Math.min(1,1280/Math.max(img.width,img.height)),q=.72,c=document.createElement('canvas'),out='';
  for(let i=0;i<7;i++){c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<800000)break;s*=.8;q=Math.max(.5,q-.06)}
  out.length<900000?ok(out):bad(new Error('Фото слишком большое'))};
 img.onerror=()=>{URL.revokeObjectURL(u);bad(new Error('Формат не поддерживается'))};img.src=u});
async function uploadPhotos(files,o){let ok=0;for(const f of files){try{const data=await compress(f);await addDoc(collection(db,'photos'),{...o,data,name:f.name,ts:now(),by:isDepot()?'depot':'cust'});ok++}catch(e){toast('Фото «'+f.name+'»: '+(e.message||e.code),'error')}}
 if(ok)toast('Фото добавлено: '+ok,'success');return ok}

async function delLoco(id){const l=D.locos.find(x=>x.id===id);if(!l)return;
 const v=await dlg({title:'Удалить паспорт?',text:`Будут безвозвратно удалены паспорт ${l.number}, все ремонты, задачи, история, узлы, анализы ИИ и фото.`,fields:[{name:'n',label:'Введите номер локомотива для подтверждения',type:'text',req:true,ph:l.number}],ok:'Удалить навсегда',danger:true,validate:v=>v.n!==String(l.number).trim()?'Номер не совпадает':''});if(!v)return;
 locoSubs.forEach(u=>u());caseSubs.forEach(u=>u());locoSubs=[];caseSubs=[];S={v:'list',id:null,cid:null,wc:null,eqf:false};render();toast('Удаление…');
 try{const refs=new Map(),take=s=>s.docs.forEach(d=>refs.set(d.ref.path,d.ref)),qf=(n,f,x)=>getDocs(query(collection(db,n),where(f,'==',x)));
  const cs=await qf('maintenanceCases','locoId',id);take(cs);
  await Promise.all([...['equipment','mileageReadings','maintenanceRecords','photos','aiAnalyses'].map(n=>qf(n,'locoId',id).then(take)),...cs.docs.flatMap(d=>['maintenanceTasks','statusHistory','aiAnalyses'].map(n=>qf(n,'caseId',d.id).then(take)))]);
  refs.set('loco',doc(db,'locomotives',id));const all=[...refs.values()];
  for(let i=0;i<all.length;i+=400){const b=writeBatch(db);all.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
  toast('Паспорт удалён','success')}catch(e){err(e)}}

 <div class="actions"><button data-a="task">+ Задача</button><button data-a="field" data-f="inspectionResult" data-l="Результат осмотра">Результат осмотра</button><button data-a="field" data-f="confirmedFaults" data-l="Подтверждённая неисправность">Подтв. неисправность</button><button data-a="field" data-f="eta" data-l="Ожидаемая дата завершения">Срок</button><button data-a="field" data-f="delayReason" data-l="Причина задержки">Задержка</button></div>

function aiBlock(a){const r=a.result||{},L=x=>(x||[]).map(v=>`<li>${esc(txt(v))}</li>`).join('');
 return`<div class="kanban-item"><div class="meta">${fmt(a.ts)} · ${esc(a.model)} · требует подтверждения специалиста</div><p>${esc(r.summary)}</p>${r.findings?.length?'<b>Выводы</b><ul>'+L(r.findings)+'</ul>':''}${r.missingData?.length?'<b>Недостающие данные</b><ul>'+L(r.missingData)+'</ul>':''}<b>Рекомендуемые проверки</b>${(r.recommendedChecks||[]).map((x,k)=>`<div class="kv">• ${esc(x.title)} <span class="meta">[${esc(x.priority||'')}] ${esc(x.basis||x.description||'')}</span> <button data-a="topl" data-id="${a.id}" data-i="${k}" style="padding:4px 8px">В план</button></div>`).join('')||'<div class="nd">нет</div>'}${r.limitations?`<div class="meta">Ограничения: ${esc(r.limitations)}</div>`:''}</div>`}

const SIDE=['disassembly','repair','assembly','adjust'];
const nexts=c=>{const s=c.stage;if(['issued','cancelled'].includes(s))return[];if(s==='paused'||s==='parts')return[c.prevStage||'repair'];
 const n=ORDER[ORDER.indexOf(s)+1],r=n?[n]:[];if(SIDE.includes(s))r.push('parts');if(s==='check')r.push('repair');if(s==='testing')r.push('adjust');if(s==='defectation')r.push('diagnostics');return r};
function guard(c,to){const T=D.tasks.filter(t=>t.caseId===c.id);if(to==='ready'&&!(c.planApproved&&T.length))return'Нужны утверждённый план и хотя бы одна задача';if(['customer','done'].includes(to)&&T.some(t=>t.status!=='done'))return'Есть незакрытые задачи';return null}
async function move(c,to,comment='',extra={}){const g=guard(c,to);if(g)return toast(g,'error');const d={stage:to,updatedAt:now(),...extra};
 if(to==='parts')d.prevStage=c.stage;
 if(to==='done'){const v=await dlg({title:'Ремонт завершён',sub:'Итоговое заключение по ремонту',fields:[{name:'n',label:'Заключение',type:'area'}],ok:'Завершить'});if(!v)return;d.conclusion=v.n;d.finishedAt=now()}
 await upd('maintenanceCases',c.id,d);await add('statusHistory',{caseId:c.id,from:c.stage,to,ts:now(),comment,by:'депо (демо)'})}
const curCase=()=>locoCases(S.id).find(x=>x.id===S.cid)||activeCase(S.id)||locoCases(S.id)[0];

async function runAI(c,l){
 const SYS='Ты помощник мастера депо. Отвечай ТОЛЬКО JSON-объектом с полями: summary(строка), findings[], missingData[], recommendedChecks[{title,description,basis,priority:"low|medium|high",requiresApproval:true}], recommendedMaintenance[{title,basis}], relatedEquipment[], reasoning, limitations, requiresHumanApproval:true. Используй только переданные данные. Не придумывай нормативы, периодичность ТО и значения. Заявленные заказчиком неисправности не считай подтверждёнными. Если данных нет — напиши об этом в missingData.';
 const it=c.intake||{},eqs=D.equipment,ctx={locomotive:{series:l.series,type:l.type,year:l.year,mileage:l.mileage,lastTO:l.lastTO,lastTOType:l.lastTOType},mileageHistory:byNew(D.miles).slice(0,10).map(m=>({value:m.value,ts:m.ts,comment:m.comment})),toHistory:D.tos.map(t=>({code:t.code,date:t.date,mileage:t.mileage})),previousRepairs:locoCases(l.id).filter(z=>z.id!==c.id).map(z=>({reason:z.reason,stage:z.stage,conclusion:z.conclusion})),case:{stage:c.stage,reason:c.reason,declaredByCustomer:{description:it.description,symptoms:it.symptoms,known:it.known,nodes:it.nodes,prechecks:it.prechecks},inspectionResult:c.inspectionResult,confirmedFaults:c.confirmedFaults},
  equipment:eqs.filter(q=>q.state!=='unknown'||q.svcDate||q.svcCode).map(q=>({name:q.name,state:EQ[q.state],lastService:[q.svcCode,q.svcDate,q.svcMileage!=null&&q.svcMileage!==''?q.svcMileage+' км':''].filter(Boolean).join(' · ')||null,note:q.note||null})),equipmentNotChecked:eqs.filter(q=>q.state==='unknown'&&!q.svcDate&&!q.svcCode).length,tasks:D.tasks.map(t=>({title:t.title,status:t.status})),maintenanceRules:D.rules.filter(r=>r.series===l.series).map(r=>({code:r.code,intervalKm:r.intervalKm,source:r.source}))};
 toast('ИИ анализирует…');
 try{const R=await aiChat([{role:'system',content:SYS},{role:'user',content:JSON.stringify(ctx)}]);
  const mj=String(R.text).match(/\{[\s\S]*\}/);if(!mj)throw new Error('ИИ вернул ответ не в JSON');const o=JSON.parse(mj[0]),A=v=>Array.isArray(v)?v:[];
  await add('aiAnalyses',{caseId:c.id,locoId:l.id,ts:now(),model:R.name,status:'pending',result:{summary:String(o.summary||''),findings:A(o.findings),missingData:A(o.missingData),recommendedChecks:A(o.recommendedChecks).filter(v=>v&&v.title),recommendedMaintenance:A(o.recommendedMaintenance),relatedEquipment:A(o.relatedEquipment),reasoning:String(o.reasoning||''),limitations:String(o.limitations||''),requiresHumanApproval:true}});toast('Анализ сохранён','success')
 }catch(e){toast('ИИ недоступен: '+e.message,'error')}}

 await add('mileageReadings',{locoId:r.id,value:120000,ts:t,source:'демо',by:'система'});

 for(const x of['Диагностика узла','Замена детали','Контрольное измерение'])await add('maintenanceTasks',{caseId:c.id,title:x,status:x==='Диагностика узла'?'done':'todo',createdAt:t});
 await ensureNodes(r.id,'Электровоз',['tm'],'система',{reason:'Демо: повышенный нагрев',to:'defect',force:true});
 await add('statusHistory',{caseId:c.id,from:'',to:'created',ts:t,comment:'Демо',by:'система'});toast('Демо-данные созданы. Организация: Демо-заказчик','success')}

  const r=await addDoc(collection(db,'maintenanceCases'),{locoId:l.id,locoNumber:l.number,org:l.org,caseNo:n,reason:v.reason,intake,stage:'created',planApproved:false,createdAt:now(),updatedAt:now()}).catch(err);if(!r)return;
  if(mil!==Number(l.mileage||0)){await add('mileageReadings',{locoId:l.id,value:mil,ts:now(),source:'заказчик (отправка в ремонт)',by:l.rep||'заказчик',comment:'при отправке в ремонт'});await upd('locomotives',l.id,{mileage:mil})}
  await hist(r.id,'','created','Отправлен в ремонт из эксплуатации'+(v.d?': '+v.d:''));try{await ensureNodes(l.id,l.type||'',[],'заказчик')}catch(_){}
  toast('Локомотив отправлен в ремонт','success');return}
 if(ch.act==='recall'){const v=await dlg({title:'Отозвать заявку?',text:'Локомотив вернётся в эксплуатацию.',fields:[{name:'r',label:'Причина',type:'area'}],ok:'Отозвать',cancel:'Назад',danger:true});if(!v)return;
  await upd('maintenanceCases',c.id,{stage:'cancelled',cancelReason:'Отозвано заказчиком'+(v.r?': '+v.r:''),updatedAt:now()});await hist(c.id,st,'cancelled','Заявка отозвана заказчиком'+(v.r?': '+v.r:''));toast('Заявка отозвана','success');return}
 if(ch.act==='accept'){const v=await dlg({title:'Принять из ремонта?',text:'Локомотив вернётся в эксплуатацию, ремонтный случай будет закрыт.',fields:[{name:'c',label:'Комментарий (необязательно)',type:'area'}],ok:'Принять'});if(!v)return;
  await upd('maintenanceCases',c.id,{stage:'issued',prevStage:st,finishedAt:c.finishedAt||now(),acceptedByCustomer:true,updatedAt:now()});await hist(c.id,st,'issued','Принят заказчиком'+(v.c?': '+v.c:''));toast('Локомотив принят, он снова в эксплуатации','success')}
});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,dep=isDepot(),c=S.v==='loco'?curCase():null,l=D.locos.find(x=>x.id===S.id);

 if(a==='eqf'){S.eqf=!S.eqf;return render()}

 if(a==='pv'){const p=D.photos.find(x=>x.id===b.dataset.id);return p&&lightbox(p,dep||p.by==='cust')}
 if(a==='delloco')return delLoco(b.dataset.id);
 if(!dep)return;
 if(a==='mile'){const v=await dlg({title:'Показание пробега',sub:'Сохранено: '+km(l.mileage),fields:[{name:'v',label:'Новое показание, км',type:'number',req:true},{name:'c',label:'Причина корректировки (если значение меньше предыдущего)',type:'area'}],ok:'Записать',validate:v=>Number(v.v)<(l.mileage||0)&&!v.c?'Значение меньше предыдущего — укажите причину':''});if(!v||!Number(v.v))return;

 if(a==='to'){const v=await dlg({title:'Выполнено ТО',fields:[{name:'code',label:'Вид ТО',type:'select',options:TO.map(t=>[t,t])},{name:'date',label:'Дата выполнения',type:'date',value:todayISO(),req:true},{name:'km',label:'Пробег при выполнении, км',type:'number',value:l.mileage||''}],ok:'Записать'});if(!v)return;
  await add('maintenanceRecords',{locoId:l.id,code:v.code,date:v.date,mileage:Number(v.km)||0,ts:now(),by:'депо (демо)'})}
 if(a==='rule'){const v=await dlg({title:'Правило ТО для серии «'+l.series+'»',sub:'Только по утверждённому нормативному документу',fields:[{name:'code',label:'Вид ТО',type:'select',options:TO.map(t=>[t,t])},{name:'km',label:'Интервал по пробегу, км',type:'number',req:true},{name:'src',label:'Нормативный источник',type:'text'}],ok:'Сохранить'});if(!v||!Number(v.km))return;
