<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWRAIL | Ремонтный цех</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="navbar">
        <h1 class="logo">NEWRAIL</h1>
        <nav class="nav-links">
            <a href="../index.html">Дашборд</a>
            <a href="maintenance.html" class="active">Задачи ТО</a>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="registry-header">
            <h2>Доска задач на обслуживание</h2>
        </div>
        
        <section class="kanban-board" style="display: flex; gap: 20px; margin-top: 20px;">
            <!-- Колонка: Ожидают -->
            <div class="kanban-column" style="flex: 1; background: #1a1a2e; padding: 15px; border-radius: 8px;">
                <h3 style="color: #ff4d4d;">Планируется (Очередь)</h3>
                <div id="tasks-planned" class="task-list"></div>
            </div>
            
            <!-- Колонка: В работе -->
            <div class="kanban-column" style="flex: 1; background: #1a1a2e; padding: 15px; border-radius: 8px;">
                <h3 style="color: #fca311;">В процессе (На канаве)</h3>
                <div id="tasks-progress" class="task-list"></div>
            </div>
            
            <!-- Колонка: Выполнено -->
            <div class="kanban-column" style="flex: 1; background: #1a1a2e; padding: 15px; border-radius: 8px;">
                <h3 style="color: #4caf50;">Выполнено (Готовы)</h3>
                <div id="tasks-done" class="task-list"></div>
            </div>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
