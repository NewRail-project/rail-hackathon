<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOCO PREDICT</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/newrail-adapter.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{font-size:11px;padding:4px 9px;border-radius:14px;border:1px solid var(--border-2);color:var(--text-dim)}
.chip.on{background:var(--kz8-yellow);color:#0a1626;border-color:var(--kz8-yellow);font-weight:700}.chip.past{color:var(--success);border-color:var(--success)}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:18px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.kv{font-size:13px;margin:4px 0}.kv b{color:var(--text-dim);font-weight:500}
select.inl{width:auto;padding:6px 8px;font-size:12px}.nd{color:var(--text-dim)}.warn{color:var(--kz8-yellow);font-size:12px}

/* ---------- ЖЕЛЕЗНОДОРОЖНЫЙ СВЕТОФОР ПЕРЕЕЗДА И ПАНЕЛЬ (КНОПКИ ДРУГ ПОД ДРУГОМ) ---------- */
.brand-header{position:relative;min-height:90px}
.rail-semaphore-panel{position:absolute;top:5px;right:20px;display:flex;flex-direction:column;align-items:center;z-index:50;pointer-events:auto}
.semaphore-heads{display:flex;gap:16px;margin-bottom:2px}
.semaphore-lamp-wrap{position:relative;width:32px;height:32px;background:#0a0d12;border-radius:50%;border:2px solid #2a3a52;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 5px rgba(0,0,0,0.8),0 4px 10px rgba(0,0,0,0.5)}
.semaphore-lamp-wrap::before{content:'';position:absolute;top:-5px;left:-4px;right:-4px;height:12px;background:linear-gradient(180deg,#1a2332,#0d1520);border:1px solid var(--border-2);border-radius:10px 10px 3px 3px;z-index:2}
.semaphore-bulb{width:18px;height:18px;background:#1e293b;border-radius:50%;box-shadow:inset 0 2px 4px rgba(0,0,0,0.9)}
@keyframes blinkLeft{0%,49%{background:#e74c3c;box-shadow:0 0 14px #e74c3c,inset 0 1px 3px rgba(255,255,255,0.5)}50%,100%{background:#5a1813;box-shadow:none}}
@keyframes blinkRight{0%,49%{background:#5a1813;box-shadow:none}50%,100%{background:#e74c3c;box-shadow:0 0 14px #e74c3c,inset 0 1px 3px rgba(255,255,255,0.5)}}
.semaphore-lamp-wrap.left-signal .semaphore-bulb{animation:blinkLeft 1s infinite}
.semaphore-lamp-wrap.right-signal .semaphore-bulb{animation:blinkRight 1s infinite}
.semaphore-pole{width:6px;background:linear-gradient(90deg,#3a4553,#6b7a90,#2a3a52);border-radius:3px;position:relative;box-shadow:2px 0 8px rgba(0,0,0,0.5);height:90px}
.semaphore-signboard{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(10px);border:2px solid var(--border-2);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;box-shadow:0 6px 20px rgba(0,0,0,0.6);white-space:nowrap}
.semaphore-signboard select,.semaphore-signboard input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;font-size:12px;border-radius:4px;width:140px}
</style></head><body><div class="bg-rails-animation"></div><div class="hud-wrapper">
<header class="brand-header">
  <h1>LOCO PREDICT</h1>
  <span class="live" id="live" style="position:absolute;left:160px;top:28px;">…</span>
  <div class="rail-semaphore-panel">
    <div class="semaphore-heads">
      <div class="semaphore-lamp-wrap left-signal"><div class="semaphore-bulb"></div></div>
      <div class="semaphore-lamp-wrap right-signal"><div class="semaphore-bulb"></div></div>
    </div>
    <div class="semaphore-pole">
      <div class="semaphore-signboard">
        <select id="role" class="inl"><option value="cust">Заказчик</option><option value="depot">Депо</option></select>
        <input id="org" placeholder="Моя организация">
      </div>
    </div>
  </div>
</header>
<nav class="train-nav"><a class="wagon active" data-a="home">Локомотивы</a><div class="train-head"></div></nav>
<main id="view"></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,where,arrayUnion} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyDoD1pNfA_cfiqCUwAKT7XHfNLOsedmhdU",authDomain:"rail-hackathon-db.firebaseapp.com",projectId:"rail-hackathon-db",storageBucket:"rail-hackathon-db.firebasestorage.app",messagingSenderId:"257494735942",appId:"1:257494735942:web:1aa10dcb7f25c83fcf3e47"}));
const $=i=>document.getElementById(i),now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=v=>v||v===0?esc(v):'<span class="nd">Нет данных</span>',fmt=t=>t?new Date(t).toLocaleString('ru-RU'):'—',txt=x=>typeof x==='string'?x:JSON.stringify(x);
const toast=(t,k='')=>{const e=document.createElement('div');e.className='toast '+k;e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},3000)};
const err=e=>toast('Ошибка: '+(e.code||e.message),'error');
const add=(n,d)=>addDoc(collection(db,n),d).catch(err),upd=(n,id,d)=>updateDoc(doc(db,n,id),d).catch(err),del=(n,id)=>deleteDoc(doc(db,n,id)).catch(err);
const ST={created:'Заявка создана',waiting:'Ожидает приёмки',accepted:'Локомотив принят',inspection:'Первичный осмотр',diagnostics:'Диагностика',plan:'Согласование плана работ',ready:'Ожидает начала ремонта',repair:'В ремонте',parts:'Ожидает детали/материалы',check:'Контрольная проверка',customer:'Ожидает приёмки заказчиком',done:'Ремонт завершён',issued:'Локомотив выдан',paused:'Приостановлен',cancelled:'Отменён'};
const ORDER=['created','waiting','accepted','inspection','diagnostics','plan','ready','repair','check','customer','done','issued'];
const EQ={unknown:'Состояние не установлено',ok:'Норма по результатам проверки',check:'Требуется доп. проверка',defect:'Обнаружен дефект',repair:'Требуется ремонт',inrepair:'Ремонт выполняется',wait:'Ожидает контрольной проверки',fixed:'Восстановлено по результатам проверки'};
const TO=[1,2,3,4,5,6,7,8].map(n=>'ТО-'+n);
const D={locos:[],cases:[],rules:[],equipment:[],miles:[],tos:[],tasks:[],hist:[],ai:[]};
let S={v:'list',id:null,cid:null,wc:null},locoSubs=[],caseSubs=[],lastSync=null;
const watch=(name,key,f,val)=>onSnapshot(f?query(collection(db,name),where(f,'==',val)):collection(db,name),s=>{D[key]=s.docs.map(d=>({id:d.id,...d.data()}));lastSync=now();render()},e=>{$('live').textContent='ошибка: '+e.code;toast(name+': '+e.code,'error')});
watch('locomotives','locos');watch('maintenanceCases','cases');watch('maintenanceTypes','rules');
const isDepot=()=>$('role').value==='depot',myOrg=()=>$('org').value.trim();
const byNew=a=>[...a].sort((x,y)=>(y.createdAt||y.ts||0)-(x.createdAt||x.ts||0));
const locoCases=id=>byNew(D.cases.filter(c=>c.locoId===id)),activeCase=id=>locoCases(id).find(c=>!['issued','cancelled'].includes(c.stage));
try{$('org').value=localStorage.org\vert{}\vert{}'';$('role').value=localStorage.role||'cust'}catch(e){}
$('org').oninput=()=>{try{localStorage.org=$('org').value}catch(e){}render()};$('role').onchange=()=>{try{localStorage.role=$('role').value}catch(e){}render()};
window.addEventListener('online',render);window.addEventListener('offline',render);

function render(){
 $('live').textContent=(navigator.onLine?'● онлайн':'○ нет связи')+(lastSync?' · данные от '+new Date(lastSync).toLocaleTimeString('ru-RU'):'');
 if(S.v==='form')return;
 $('view').innerHTML=S.v==='loco'?passport():list();
 if(S.v==='loco'&&$('qr')&&window.QRCode){$('qr').innerHTML='';new QRCode($('qr'),{text:location.origin+location.pathname+'?loco='+S.id,width:120,height:120})}
}
function status(l){const c=activeCase(l.id);return c?`<span class="badge progress">${ST[c.stage]}</span>`:'<span class="badge done">В эксплуатации</span>'}
function list(){
 const dep=isDepot(),org=myOrg(),ls=byNew(D.locos.filter(l=>dep||(org&&l.org===org)));
 let h=`<div class="toolbar"><button class="primary" data-a="new">+ Сдать локомотив в ремонт</button>${dep?'<button data-a="seed">Демо-данные</button>':''}</div>`;
 if(!dep&&!org)h+='<div class="empty">Введите название вашей организации в шапке, чтобы увидеть свои локомотивы</div>';
 else h+=ls.length?ls.map(l=>`<div class="kanban-item"><div class="row"><div class="id">${esc(l.number)} · ${esc(l.series)}</div>${status(l)}</div><div class="meta">${esc(l.org)} · ${Number(l.mileage||0).toLocaleString('ru-RU')} км</div><div class="actions"><button data-a="open" data-id="${l.id}">Паспорт</button>${dep?`<button class="danger" data-a="delloco" data-id="${l.id}">Удалить</button>`:''}</div></div>`).join(''):'<div class="empty">Локомотивов пока нет</div>';
 return h}

const FORM=[['Локомотив',[['number','Номер*'],['series','Серия и модель*'],['type','Тип',['','Электровоз','Тепловоз','Маневровый']],['factoryNo','Заводской номер'],['year','Год выпуска','number'],['depot','Депо приписки'],['mileage','Текущий пробег, км*','number'],['mileageDate','Дата подтверждения пробега','date'],['lastTO','Дата последнего ТО','date'],['lastTOType','Вид последнего ТО',['',...TO]],['prevRepair','Предыдущий ремонт']]],
['Заказчик',[['org','Организация*'],['rep','ФИО представителя*'],['position','Должность'],['phone','Телефон','tel'],['email','E-mail','email']]],
['Причина поступления',[['reason','Причина*',['','Плановое ТО','Обнаруженная неисправность','Внеплановый ремонт','Диагностическая проверка','Повторное обращение','Другая']],['description','Описание проблемы','area'],['symptoms','Симптомы','area'],['found','Когда обнаружена'],['conditions','При каких условиях проявляется'],['nodes','Предположительно затронутые узлы'],['prechecks','Проведённые проверки'],['notes','Дополнительные замечания']]],
['Состояние при сдаче',[['external','Внешнее состояние','area'],['known','Известные неисправности','area'],['complete','Комплектность'],['handover','Замечания при передаче']]]];
function openForm(){S.v='form';const dep=isDepot();
 $('view').innerHTML='<form id="intake" class="card" novalidate><h2>Сдать локомотив в ремонт</h2><div class="subtitle">Неизвестные данные оставьте пустыми — они не будут заменены выдуманными</div>'+FORM.map(([t,fs])=>`<h3 class="sec">${t}</h3><div class="grid grid-2">`+fs.map(([n,l,k])=>`<div class="field"><label>${l}</label>`+(Array.isArray(k)?`<select name="${n}">${k.map(o=>`<option>${o}</option>`).join('')}</select>`:k==='area'?`<textarea name="${n}" rows="2"></textarea>`:`<input name="${n}" type="${k||'text'}" ${n==='org'&&!dep?`value="${esc(myOrg())}"`:''}>`)+'</div>').join('')+'</div>').join('')+'<div class="row" style="justify-content:flex-start"><button class="primary">Зарегистрировать</button><button type="button" data-a="home">Отмена</button></div></form>';
 $('intake').onsubmit=submitIntake}
async function submitIntake(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 const miss=['number','series','mileage','org','rep','reason'].filter(k=>!String(f[k]||'').trim());
 [...e.target.elements].forEach(i=>i.classList&&i.classList.toggle('invalid',miss.includes(i.name)));
 if(miss.length)return toast('Заполните обязательные поля','error');
 if(!confirm('Подтвердить регистрацию? Исходные данные приёмки будут сохранены в истории.'))return;
 Object.keys(f).forEach(k=>f[k]=String(f[k]).trim());const km=Number(f.mileage)||0;let l=D.locos.find(x=>x.number===f.number&&x.org===f.org),id=l&&l.id,cm='по анкете';
 if(l&&km<(l.mileage||0)){cm=prompt(`Пробег меньше сохранённого (${l.mileage} км). Укажите причину корректировки:`);if(!cm)return toast('Нужна причина корректировки','error')}
 if(!l){const r=await addDoc(collection(db,'locomotives'),{number:f.number,series:f.series,type:f.type,factoryNo:f.factoryNo,year:f.year,depot:f.depot,org:f.org,rep:f.rep,mileage:km,mileageDate:f.mileageDate,lastTO:f.lastTO,lastTOType:f.lastTOType,prevRepair:f.prevRepair,createdAt:now()}).catch(err);if(!r)return;id=r.id}
 else await upd('locomotives',id,{mileage:km,mileageDate:f.mileageDate||l.mileageDate});
 await add('mileageReadings',{locoId:id,value:km,date:f.mileageDate,ts:now(),source:'анкета заказчика',by:f.rep,comment:cm});
 const n=D.cases.filter(c=>c.locoId===id).length+1,c=await addDoc(collection(db,'maintenanceCases'),{locoId:id,locoNumber:f.number,org:f.org,caseNo:n,reason:f.reason,intake:f,stage:'created',planApproved:false,createdAt:now(),updatedAt:now()}).catch(err);
 if(c)await add('statusHistory',{caseId:c.id,from:'',to:'created',ts:now(),comment:'Анкета подтверждена',by:f.rep});
 toast('Паспорт и ремонтный случай созданы','success');openLoco(id)}

function openLoco(id){locoSubs.forEach(u=>u());caseSubs.forEach(u=>u());caseSubs=[];Object.assign(D,{equipment:[],miles:[],tos:[],tasks:[],hist:[],ai:[]});
 S={v:'loco',id,cid:null,wc:null};locoSubs=[watch('equipment','equipment','locoId',id),watch('mileageReadings','miles','locoId',id),watch('maintenanceRecords','tos','locoId',id)];render()}
function ensureCase(c){if(c&&S.wc!==c.id){S.wc=c.id;caseSubs.forEach(u=>u());D.tasks=[];D.hist=[];D.ai=[];caseSubs=[watch('maintenanceTasks','tasks','caseId',c.id),watch('statusHistory','hist','caseId',c.id),watch('aiAnalyses','ai','caseId',c.id)]}}
const kv=(l,v)=>`<div class="kv"><b>${l}:</b> ${nd(v)}</div>`;
function passport(){
 const l=D.locos.find(x=>x.id===S.id);if(!l)return'<div class="empty">Загрузка паспорта…</div>';
 const dep=isDepot();if(!dep&&l.org!==myOrg())return'<div class="empty">Нет доступа: локомотив принадлежит другой организации<br><br><button data-a="home">Назад</button></div>';
 const cs=locoCases(l.id),c=cs.find(x=>x.id===S.cid)||activeCase(l.id)||cs[0];ensureCase(c);
 const ms=byNew(D.miles),tos=byNew(D.tos),eq=byNew(D.equipment);
 return`<div class="row"><button data-a="home">← К списку</button>${dep?`<button class="danger" data-a="delloco" data-id="${l.id}">Удалить локомотив</button>`:''}<span>${status(l)}</span></div>
 <div class="card"><h2>Цифровой паспорт ${esc(l.number)}</h2><div class="row" style="align-items:flex-start"><div>${kv('Серия и модель',l.series)}${kv('Тип',l.type)}${kv('Заводской номер',l.factoryNo)}${kv('Год выпуска',l.year)}${kv('Организация-владелец',l.org)}${kv('Депо приписки',l.depot)}</div><div><div id="qr"></div><div class="meta">QR → постоянная страница локомотива</div></div></div></div>
 <div class="card"><h2>Эксплуатация</h2>${kv('Подтверждённый пробег',l.mileage!=null?Number(l.mileage).toLocaleString('ru-RU')+' км (на '+(l.mileageDate||'дату не указано')+')':'')}${kv('Последнее ТО',l.lastTO?l.lastTOType+' · '+l.lastTO:'')}${kv('Предыдущий ремонт',l.prevRepair)}
 <h3 class="sec">История пробега</h3>${ms.map(m=>`<div class="kv">${Number(m.value).toLocaleString('ru-RU')} км · ${fmt(m.ts)} ·${esc(m.source)} · ${esc(m.by\vert{}\vert{}'')}${m.comment?'· «'+esc(m.comment)+'»':''}</div>`).join('')||'<div class="nd">Нет данных</div>'}${dep?'<div class="actions"><button data-a="mile">+ Показание пробега</button></div>':''}
 <h3 class="sec">История ТО-1 — ТО-8</h3>${tos.map(t=>`<div class="kv">${esc(t.code)} · ${esc(t.date)} ·${Number(t.mileage||0).toLocaleString('ru-RU')} км</div>`).join('')||'<div class="nd">Нет данных</div>'}${dep?'<div class="actions"><button data-a="to">+ Выполнено ТО</button><button data-a="rule">+ Правило ТО для серии</button></div>':''}
 <h3 class="sec">Ближайшее ТО</h3>${nextTO(l,tos)}</div>
 <div class="card"><h2>Техническое состояние</h2>${eq.map(q=>`<div class="kanban-item"><div class="row"><div class="id">${esc(q.name)}</div>${dep?`<select class="inl" data-a="eqs" data-id="${q.id}">${Object.entries(EQ).map(([k,v])=>`<option value="${k}" ${k===q.state?'selected':''}>${v}</option>`).join('')}</select>`:`<span class="badge progress">${EQ[q.state]||''}</span>`}</div><div class="meta">Изменений в истории: ${(q.history\vert{}\vert{}[]).length}${q.history&&q.history.length?' · последнее: '+esc(q.history[q.history.length-1].reason):''}</div></div>`).join('')||'<div class="empty">Узлы не внесены. Отсутствие записей не означает исправность.</div>'}${dep?'<div class="actions"><button data-a="eq">+ Узел</button></div>':''}</div>
 <div class="card"><h2>Ремонты</h2><div class="actions">${cs.map(x=>`<button data-a="case" data-id="${x.id}" ${c&&x.id===c.id?'class="primary"':''}>№${x.caseNo} ·${ST[x.stage]}</button>`).join('')||'<span class="nd">Ремонтных случаев нет</span>'}</div>${c?caseBody(c,l,dep):''}</div>
 <div class="card"><h2>Документы и фото</h2><div class="nd">Нет данных. Загрузка файлов требует Firebase Storage (в этой демо-версии не подключён).</div></div>`}
function nextTO(l,tos){const rs=D.rules.filter(r=>r.series===l.series);if(!rs.length)return`<div class="warn">Правила ТО для серии «${esc(l.series)}» не заданы — срок рассчитать нельзя. Не выдумываем нормативы: добавьте утверждённое правило.</div>`;
 return rs.map(r=>{const last=byNew(tos.filter(t=>t.code===r.code))[0];if(!last)return`<div class="kv">${esc(r.code)}: нет записи о выполнении — расчёт невозможен</div>`;const left=Number(last.mileage)+Number(r.intervalKm)-Number(l.mileage||0);return`<div class="kv">${esc(r.code)}: ${left<0?'<span style="color:var(--danger)">просрочено на '+(-left)+' км</span>':'осталось '+left+' км'} · правило: ${esc(r.intervalKm)} км (источник: ${esc(r.source||'не указан')})</div>`}).join('')}

function caseBody(c,l,dep){
 const T=D.tasks.filter(t=>t.caseId===c.id),done=T.filter(t=>t.status==='done').length,pct=T.length?Math.round(done/T.length*100):0,i=ORDER.indexOf(c.stage===('parts')?'repair':c.stage==='paused'?(c.prevStage||'created'):c.stage),it=c.intake||{},ai=byNew(D.ai)[0];
 const chips=ORDER.map((s,k)=>`<span class="chip ${s===c.stage||(c.stage==='parts'&&s==='repair')?'on':k<i?'past':''}">${ST[s]}</span>`).join('');
 return`<div class="stages">${chips}${['parts','paused','cancelled'].includes(c.stage)?`<span class="chip on">${ST[c.stage]}</span>`:''}</div>
 <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div><div class="meta">Выполнено задач: ${done} из ${T.length} (${pct}%) · обновлено ${fmt(c.updatedAt)}</div>
 ${kv('Причина обращения',c.reason)}${kv('Поступил',fmt(c.createdAt))}${kv('Пробег при поступлении',it.mileage?it.mileage+' км':'')}
 ${kv('Заявлено заказчиком (не подтверждено)',[it.description,it.symptoms,it.known].filter(Boolean).join(' · '))}${kv('Результат осмотра депо',c.inspectionResult)}${kv('Подтверждённая неисправность',c.confirmedFaults)}${kv('Ожидаемая дата завершения',c.eta)}${kv('Задержка',c.delayReason)}${c.pauseReason?kv('Причина приостановки',c.pauseReason):''}${c.cancelReason?kv('Причина отмены',c.cancelReason):''}${c.conclusion?kv('Итоговое заключение',c.conclusion):''}
 <h3 class="sec">Задачи</h3>${T.map(t=>`<div class="kanban-item"><div class="row"><div>${esc(t.title)}${t.source==='ai'?' <span class="badge progress">из ИИ-анализа</span>':''}</div>${t.status==='done'?'<span class="badge done">выполнено</span>':dep?`<button data-a="tdone" data-id="${t.id}">Выполнено</button>`:'<span class="badge waiting">ожидает</span>'}</div></div>`).join('')||'<div class="nd">Задач нет</div>'}
 <h3 class="sec">История стадий</h3>${byNew(D.hist).map(h=>`<div class="kv">${fmt(h.ts)} ·${ST[h.from]||'—'} → <b style="color:var(--text)">${ST[h.to]}</b> · ${esc(h.by)}${h.comment?'· «'+esc(h.comment)+'»':''}</div>`).join('')||'<div class="nd">Нет данных</div>'}
 ${dep?`<h3 class="sec">Действия депо</h3><div class="actions">${nexts(c).map(s=>`<button class="primary" data-a="move" data-to="${s}">→ ${ST[s]}</button>`).join('')}${c.stage==='plan'&&!c.planApproved?'<button data-a="approve">Утвердить план</button>':''}${!['issued','cancelled','paused'].includes(c.stage)?'<button data-a="pause">Приостановить</button><button class="danger" data-a="cancel">Отменить</button>':''}</div>
 <div class="actions"><button data-a="task">+ Задача</button><button data-a="field" data-f="inspectionResult" data-l="Результат осмотра">Результат осмотра</button><button data-a="field" data-f="confirmedFaults" data-l="Подтверждённая неисправность">Подтв. неисправность</button><button data-a="field" data-f="eta" data-l="Ожидаемая дата завершения">Срок</button><button data-a="field" data-f="delayReason" data-l="Причина задержки">Задержка</button></div>
 <h3 class="sec">Анализ ИИ</h3><div class="actions"><button class="primary" data-a="ai">Анализировать локомотив</button></div>${ai?aiBlock(ai):'<div class="nd">Анализов нет</div>'}`:''}`}
function aiBlock(a){const r=a.result||{},L=x=>(x||[]).map(v=>`<li>${esc(txt(v))}</li>`).join('');
 return`<div class="kanban-item"><div class="meta">${fmt(a.ts)} · ${esc(a.model)} · требует подтверждения специалиста</div><p>${esc(r.summary)}</p>${r.findings?.length?'<b>Выводы</b><ul>'+L(r.findings)+'</ul>':''}${r.missingData?.length?'<b>Недостающие данные</b><ul>'+L(r.missingData)+'</ul>':''}<b>Рекомендуемые проверки</b>${(r.recommendedChecks||[]).map((x,k)=>`<div class="kv">• ${esc(x.title)} <span class="meta">[${esc(x.priority\vert{}\vert{}'')}]${esc(x.basis||x.description||'')}</span> <button data-a="topl" data-id="${a.id}" data-i="${k}" style="padding:4px 8px">В план</button></div>`).join('')||'<div class="nd">нет</div>'}${r.limitations?`<div class="meta">Ограничения: ${esc(r.limitations)}</div>`:''}</div>`}
const nexts=c=>{const s=c.stage;if(['issued','cancelled'].includes(s))return[];if(s==='paused')return[c.prevStage||'created'];if(s==='parts')return['repair'];if(s==='repair')return['check','parts'];if(s==='check')return['customer','repair'];const n=ORDER[ORDER.indexOf(s)+1];return n?[n]:[]};
function guard(c,to){const T=D.tasks.filter(t=>t.caseId===c.id);if(to==='ready'&&!(c.planApproved&&T.length))return'Нужны утверждённый план и хотя бы одна задача';if(['customer','done'].includes(to)&&T.some(t=>t.status!=='done'))return'Есть незакрытые задачи';return null}
async function move(c,to,comment='',extra={}){const g=guard(c,to);if(g)return toast(g,'error');const d={stage:to,updatedAt:now(),...extra};
 if(to==='done'){const n=prompt('Итоговое заключение по ремонту:');if(n===null)return;d.conclusion=n;d.finishedAt=now()}
 await upd('maintenanceCases',c.id,d);await add('statusHistory',{caseId:c.id,from:c.stage,to,ts:now(),comment,by:'депо (демо)'})}
const curCase=()=>{const l=D.locos.find(x=>x.id===S.id);return locoCases(S.id).find(x=>x.id===S.cid)||activeCase(S.id)||locoCases(S.id)[0]};

async function runAI(c,l){const key=localStorage.ai_key;if(!key)return toast('Сначала укажите ключ ИИ (кнопка в шапке)','error');
 const x=key.startsWith('xai-'),url=x?'https://api.x.ai/v1/chat/completions':'https://api.groq.com/openai/v1/chat/completions',model=localStorage.ai_model||(x?'grok-3':'llama-3.3-70b-versatile');
 const SYS='Ты помощник мастера депо. Отвечай ТОЛЬКО JSON-объектом с полями: summary(строка), findings[], missingData[], recommendedChecks[{title,description,basis,priority:"low|medium|high",requiresApproval:true}], recommendedMaintenance[{title,basis}], relatedEquipment[], reasoning, limitations, requiresHumanApproval:true. Используй только переданные данные. Не придумывай нормативы, периодичность ТО и значения. Заявленные заказчиком неисправности не считай подтверждёнными. Если данных нет — напиши об этом в missingData.';
 const it=c.intake||{},ctx={locomotive:{series:l.series,type:l.type,year:l.year,mileage:l.mileage,lastTO:l.lastTO,lastTOType:l.lastTOType},mileageHistory:byNew(D.miles).slice(0,10).map(m=>({value:m.value,ts:m.ts,comment:m.comment})),toHistory:D.tos.map(t=>({code:t.code,date:t.date,mileage:t.mileage})),previousRepairs:locoCases(l.id).filter(z=>z.id!==c.id).map(z=>({reason:z.reason,stage:z.stage,conclusion:z.conclusion})),case:{stage:c.stage,reason:c.reason,declaredByCustomer:{description:it.description,symptoms:it.symptoms,known:it.known,nodes:it.nodes,prechecks:it.prechecks},inspectionResult:c.inspectionResult,confirmedFaults:c.confirmedFaults},equipment:D.equipment.map(q=>({name:q.name,state:q.state})),tasks:D.tasks.map(t=>({title:t.title,status:t.status})),maintenanceRules:D.rules.filter(r=>r.series===l.series).map(r=>({code:r.code,intervalKm:r.intervalKm,source:r.source}))};
 toast('ИИ анализирует…');
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model,temperature:.2,response_format:{type:'json_object'},messages:[{role:'system',content:SYS},{role:'user',content:JSON.stringify(ctx)}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);const o=JSON.parse(j.choices[0].message.content),A=v=>Array.isArray(v)?v:[];
  await add('aiAnalyses',{caseId:c.id,locoId:l.id,ts:now(),model,status:'pending',result:{summary:String(o.summary||''),findings:A(o.findings),missingData:A(o.missingData),recommendedChecks:A(o.recommendedChecks).filter(v=>v&&v.title),recommendedMaintenance:A(o.recommendedMaintenance),relatedEquipment:A(o.relatedEquipment),reasoning:String(o.reasoning||''),limitations:String(o.limitations||''),requiresHumanApproval:true}});toast('Анализ сохранён','success')
 }catch(e){toast('ИИ недоступен: '+e.message,'error')}}

async function seed(){const t=now(),r=await addDoc(collection(db,'locomotives'),{number:'ДЕМО-001',series:'Демо-серия',type:'Электровоз',org:'Демо-заказчик',rep:'Иванов И.И.',depot:'Главное депо',mileage:120000,mileageDate:'2026-10-01',lastTO:'2026-09-01',lastTOType:'ТО-3',createdAt:t}).catch(err);if(!r)return;
 await add('mileageReadings',{locoId:r.id,value:120000,ts:t,source:'демо',by:'система'});
 const c=await addDoc(collection(db,'maintenanceCases'),{locoId:r.id,locoNumber:'ДЕМО-001',org:'Демо-заказчик',caseNo:1,reason:'Обнаруженная неисправность',intake:{mileage:'120000',description:'Повышенный нагрев узла',symptoms:'Рост температуры на подъёмах'},stage:'repair',planApproved:true,createdAt:t,updatedAt:t}).catch(err);
 for(const x of['Диагностика узла','Замена детали','Контрольное измерение'])await add('maintenanceTasks',{caseId:c.id,title:x,status:x==='Диагностика узла'?'done':'todo',createdAt:t});
 await add('equipment',{locoId:r.id,name:'Тяговый двигатель (демо)',state:'defect',history:[],createdAt:t});await add('statusHistory',{caseId:c.id,from:'',to:'created',ts:t,comment:'Демо',by:'система'});toast('Демо-данные созданы. Организация: Демо-заказчик','success')}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,dep=isDepot(),c=S.v==='loco'?curCase():null,l=D.locos.find(x=>x.id===S.id);
 if(a==='home'){locoSubs.forEach(u=>u());caseSubs.forEach(u=>u());S={v:'list'};return render()}
 if(a==='new')return openForm();if(a==='open')return openLoco(b.dataset.id);if(a==='seed')return seed();
 if(a==='case'){S.cid=b.dataset.id;return render()}
 if(a==='delloco'&&dep){
   const locoId=b.dataset.id;
   if(confirm('Внимание! Локомотив будет полностью удален из базы данных. Продолжить?')){
     await del('locomotives',locoId);
     toast('Локомотив удален','success');
     S={v:'list'};
     render();
   }
   return;
 }
 if(!dep)return;
 if(a==='mile'){const v=Number(prompt('Новое показание пробега, км:'));if(!v)return;let cm='';if(v<(l.mileage||0)){cm=prompt('Значение меньше предыдущего. Причина корректировки:');if(!cm)return toast('Нужна причина','error')}
  await add('mileageReadings',{locoId:l.id,value:v,ts:now(),source:'депо',by:'депо (демо)',comment:cm,caseId:c?c.id:''});await upd('locomotives',l.id,{mileage:v,mileageDate:new Date().toISOString().slice(0,10)})}
 if(a==='to'){const code=prompt('Вид ТО ('+TO.join(', ')+'):','ТО-1');if(!TO.includes(code))return toast('Неверный вид ТО','error');const date=prompt('Дата выполнения (ГГГГ-ММ-ДД):',new Date().toISOString().slice(0,10)),km=prompt('Пробег при выполнении, км:',l.mileage||'');if(!date)return;await add('maintenanceRecords',{locoId:l.id,code,date,mileage:Number(km)||0,ts:now(),by:'депо (демо)'})}
 if(a==='rule'){const code=prompt('Вид ТО по утверждённому правилу ('+TO.join(', ')+'):');if(!TO.includes(code))return;const km=Number(prompt('Интервал по пробегу, км (из нормативного документа):'));if(!km)return;await add('maintenanceTypes',{series:l.series,code,intervalKm:km,source:prompt('Нормативный источник:')||'',createdAt:now()})}
 if(a==='eq'){const n=prompt('Название узла:');if(n)await add('equipment',{locoId:l.id,name:n.trim(),state:'unknown',history:[],createdAt:now()})}
 if(a==='task'&&c){const t=prompt('Название задачи:');if(t)await add('maintenanceTasks',{caseId:c.id,title:t.trim(),status:'todo',createdAt:now()})}
 if(a==='tdone')await upd('maintenanceTasks',b.dataset.id,{status:'done',finishedAt:now()});
 if(a==='field'&&c){const v=prompt(b.dataset.l+':',c[b.dataset.f]||'');if(v!==null)await upd('maintenanceCases',c.id,{[b.dataset.f]:v.trim(),updatedAt:now()})}
 if(a==='approve'&&c){if(confirm('Утвердить план работ как ответственный специалист?'))await upd('maintenanceCases',c.id,{planApproved:true,updatedAt:now()})}
 if(a==='move'&&c)await move(c,b.dataset.to);
 if(a==='pause'&&c){const r=prompt('Причина приостановки:');if(r)await move(c,'paused',r,{prevStage:c.stage,pauseReason:r})}
 if(a==='cancel'&&c){const r=prompt('Причина отмены:');if(r&&confirm('Отменить ремонт?'))await move(c,'cancelled',r,{cancelReason:r})}
 if(a==='ai'&&c)await runAI(c,l);
 if(a==='topl'&&c){const an=D.ai.find(x=>x.id===b.dataset.id),ch=an&&an.result.recommendedChecks[b.dataset.i];if(ch&&confirm('Добавить в план как задачу (решение специалиста)?'))await add('maintenanceTasks',{caseId:c.id,title:ch.title,description:ch.description||'',status:'todo',source:'ai',aiId:an.id,createdAt:now()})}
});
document.addEventListener('change',async e=>{const s=e.target;if(s.dataset&&s.dataset.a==='eqs'){const q=D.equipment.find(x=>x.id===s.dataset.id),r=prompt('Причина изменения состояния:');if(!r){render();return}await upd('equipment',q.id,{state:s.value,history:arrayUnion({from:q.state,to:s.value,ts:now(),reason:r,by:'депо (демо)'})})}});
const q=new URLSearchParams(location.search).get('loco');if(q)openLoco(q);else render();
