<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWRAIL | Паспорт</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="navbar">
        <nav class="nav-links"><a href="../index.html">← В реестр</a></nav>
    </header>
    <main class="passport-container">
        <!-- Шапка -->
        <section class="loco-header" style="display:flex; gap: 20px;">
            <div id="loco-photo-container" style="width: 200px; height: 150px; background: #222;"></div>
            <div>
                <h2 id="loco-title">Загрузка...</h2>
                <p id="loco-specs">Характеристики загружаются...</p>
                <div id="loco-status-badge" class="badge">Статус</div>
                <button id="btn-generate-qr" style="margin-top:10px;" class="btn-secondary">Показать QR</button>
            </div>
        </section>

        <!-- Ввод измерений -->
        <section class="equipment-section">
            <h3>Диагностика оборудования</h3>
            <form id="measurement-form" class="data-form">
                <select id="equip-select" required><option value="">Выберите узел...</option></select>
                <input type="number" id="metric-value" placeholder="Температура (°C)" required>
                <button type="submit" class="btn-primary">Внести показания</button>
            </form>
            <div id="equipment-list" class="equip-cards"></div>
        </section>

        <!-- Задачи и Отклонения (НОВЫЙ БЛОК) -->
        <section class="tasks-section" style="display: flex; gap: 20px; margin-top: 20px;">
            <div style="flex: 1;">
                <h3 style="color: #ff4d4d;">Выявленные отклонения</h3>
                <div id="anomalies-list" class="list-container">Ожидание данных...</div>
            </div>
            <div style="flex: 1;">
                <h3 style="color: #4da6ff;">Активные задачи (ТО)</h3>
                <div id="tasks-list" class="list-container">Ожидание данных...</div>
            </div>
        </section>
    </main>

    <!-- Модалка QR -->
    <div id="qr-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div id="qr-container"></div>
            <button id="btn-close-qr" class="btn-secondary">Закрыть</button>
        </div>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
