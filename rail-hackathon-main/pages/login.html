<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWRAIL | Доступ закрыт</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0f0f1a;">
    <div class="card" style="width: 320px; padding: 30px; border-radius: 8px; background:#1a1a2e;">
        <h2 style="text-align:center; margin-bottom: 20px;">Идентификация</h2>
        <form id="login-form" class="data-form">
            <input type="email" id="auth-email" placeholder="Служебный Email" required style="width:100%; margin-bottom:15px; padding:10px;">
            <input type="password" id="auth-pass" placeholder="Пароль" required style="width:100%; margin-bottom:15px; padding:10px;">
            <button type="submit" class="btn-primary" style="width:100%; padding:10px;">Войти в систему</button>
        </form>
        <p id="auth-error" style="color:#ff4d4d; font-size:12px; text-align:center; display:none; margin-top:10px;"></p>
    </div>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
