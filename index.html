<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewRail · Эксплуатация / Депо</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/newrail-adapter.css">
</head>
<body>
<div class="hud-wrapper">
  <header class="brand-header"><h1>NewRail</h1><span class="live" id="live">подключение…</span></header>

  <nav class="train-nav">
    <a class="wagon active" data-tab="ops">Эксплуатация</a>
    <a class="wagon" data-tab="depot">Депо</a>
    <div class="train-head"></div>
  </nav>

  <!-- ЭКСПЛУАТАЦИЯ -->
  <main id="ops">
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="stat"><div class="label">Всего профилей</div><div class="value accent" id="oAll">0</div></div>
      <div class="stat"><div class="label">В депо</div><div class="value yellow" id="oDepot">0</div></div>
      <div class="stat"><div class="label">Вернулись из ремонта</div><div class="value green" id="oDone">0</div></div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Поиск по номеру или серии…">
      <button class="primary" id="addBtn">+ Профиль локомотива</button>
    </div>
    <div class="card"><h2>Парк эксплуатации</h2><div class="subtitle">Создайте профиль и передайте локомотив в депо</div><div id="opsList"></div></div>
  </main>

  <!-- ДЕПО -->
  <main id="depot" style="display:none">
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="stat"><div class="label">Поступили</div><div class="value red" id="dSent">0</div></div>
      <div class="stat"><div class="label">Приняты</div><div class="value accent" id="dAcc">0</div></div>
      <div class="stat"><div class="label">В ремонте</div><div class="value yellow" id="dRep">0</div></div>
      <div class="stat"><div class="label">Готовы</div><div class="value green" id="dDone">0</div></div>
    </div>
    <div class="kanban" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <div class="kanban-col"><h3>Поступили</h3><div id="col-sent"></div></div>
      <div class="kanban-col"><h3>Приняты</h3><div id="col-accepted"></div></div>
      <div class="kanban-col"><h3>В ремонте</h3><div id="col-repair"></div></div>
      <div class="kanban-col"><h3>Готовы к выдаче</h3><div id="col-done"></div></div>
    </div>
  </main>
</div>

<div class="modal" id="addModal">
  <form class="modal-content" id="addForm" novalidate>
    <h2>Новый профиль локомотива</h2>
    <div class="field"><label>Номер</label><input name="number" required placeholder="ВЛ80С-1428"></div>
    <div class="field"><label>Серия</label>
      <select name="series"><option>ВЛ80С</option><option>2ЭС5К</option><option>ЭП1</option><option>ТЭП70БС</option><option>2ТЭ116У</option></select></div>
    <div class="field"><label>Тип</label>
      <select name="type"><option>Грузовой</option><option>Пассажирский</option><option>Маневровый</option></select></div>
    <div class="field"><label>Пробег, км</label><input name="mileage" type="number" min="0" value="0"></div>
    <div class="field"><label>Замечания / причина заезда</label><input name="defect" placeholder="Нагрев МОП, плановое ТО…"></div>
    <div style="display:flex;gap:10px"><button type="submit" class="primary">Создать</button><button type="button" id="addCancel">Отмена</button></div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyDoD1pNfA_cfiqCUwAKT7XHfNLOsedmhdU",
  authDomain: "rail-hackathon-db.firebaseapp.com",
  projectId: "rail-hackathon-db",
  storageBucket: "rail-hackathon-db.firebasestorage.app",
  messagingSenderId: "257494735942",
  appId: "1:257494735942:web:1aa10dcb7f25c83fcf3e47"
}));
const COL = "locomotives";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (t, type = '') => {
  const e = document.createElement('div'); e.className = 'toast ' + type; e.textContent = t; document.body.appendChild(e);
  setTimeout(() => { e.style.opacity = 0; setTimeout(() => e.remove(), 300); }, 2600);
};
// new = профиль создан (эксплуатация) · sent → accepted → repair → done (депо)
const ST = { new:['Профиль создан','waiting'], sent:['Передан в депо','waiting'], accepted:['Принят депо','progress'], repair:['В ремонте','progress'], done:['Ремонт завершён','done'] };
const badge = s => `<span class="badge ${ST[s]?.[1] || 'waiting'}">${ST[s]?.[0] || s}</span>`;
const upd = (id, data) => updateDoc(doc(db, COL, id), { ...data, updatedAt: Date.now() }).catch(e => toast('Ошибка: ' + e.code, 'error'));

/* ---------- вкладки ---------- */
function tab(name) {
  $('ops').style.display = name === 'ops' ? '' : 'none';
  $('depot').style.display = name === 'depot' ? '' : 'none';
  document.querySelectorAll('.wagon').forEach(w => w.classList.toggle('active', w.dataset.tab === name));
  history.replaceState(null, '', '#' + name);
}
document.querySelectorAll('.wagon').forEach(w => w.onclick = () => tab(w.dataset.tab));
tab(location.hash === '#depot' ? 'depot' : 'ops');

/* ---------- данные ---------- */
let items = [];
onSnapshot(collection(db, COL), snap => {
  items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $('live').textContent = '● онлайн'; render();
}, err => { $('live').textContent = 'ошибка: ' + err.code; toast('Firestore: ' + err.code, 'error'); });

const card = (i, actions) => `<div class="kanban-item">
  <div class="id">${esc(i.number)}</div>
  <div class="meta">${esc(i.series)} · ${esc(i.type)} · ${Number(i.mileage || 0).toLocaleString('ru-RU')} км</div>
  ${i.defect ? `<div class="meta">Замечание: ${esc(i.defect)}</div>` : ''}
  ${i.work ? `<div class="meta">Работы: ${esc(i.work)}</div>` : ''}
  <div class="meta">${badge(i.status)}</div>
  <div class="actions">${actions}</div></div>`;
const btn = (act, id, text) => `<button data-act="${act}" data-id="${id}">${text}</button>`;

function render() {
  const q = $('search').value.trim().toLowerCase();
  const mine = items.filter(i => !q || `${i.number} ${i.series}`.toLowerCase().includes(q));
  $('opsList').innerHTML = mine.length ? mine.map(i => card(i,
    i.status === 'new' ? btn('send', i.id, 'Передать в депо') + btn('del', i.id, 'Удалить')
    : i.status === 'done' ? btn('take', i.id, 'Принять из депо')
    : '<span class="meta">Локомотив в депо</span>')).join('') : '<div class="empty">Профилей пока нет</div>';

  const by = s => items.filter(i => i.status === s);
  const acts = { sent: i => btn('accept', i.id, 'Принять'), accepted: i => btn('repair', i.id, 'В ремонт'),
                 repair: i => btn('finish', i.id, 'Ремонт завершён'), done: () => '<span class="meta">Ждёт возврата в эксплуатацию</span>' };
  for (const s of ['sent', 'accepted', 'repair', 'done'])
    $('col-' + s).innerHTML = by(s).length ? by(s).map(i => card(i, acts[s](i))).join('') : '<div class="empty">Пусто</div>';

  $('oAll').textContent = items.length;
  $('oDepot').textContent = ['sent', 'accepted', 'repair'].reduce((n, s) => n + by(s).length, 0);
  $('oDone').textContent = by('done').length;
  $('dSent').textContent = by('sent').length; $('dAcc').textContent = by('accepted').length;
  $('dRep').textContent = by('repair').length; $('dDone').textContent = by('done').length;
}
$('search').oninput = render;

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'send') upd(id, { status: 'sent', sentAt: Date.now() });
  if (act === 'accept') upd(id, { status: 'accepted', acceptedAt: Date.now() });
  if (act === 'repair') { const w = prompt('Какие работы проводятся?', ''); if (w !== null) upd(id, { status: 'repair', work: w.trim() }); }
  if (act === 'finish') upd(id, { status: 'done', finishedAt: Date.now() });
  if (act === 'take') upd(id, { status: 'new', defect: '', work: '' });
  if (act === 'del' && confirm('Удалить профиль?')) deleteDoc(doc(db, COL, id)).catch(e => toast('Ошибка: ' + e.code, 'error'));
});

/* ---------- создание профиля ---------- */
const modal = s => $('addModal').style.display = s ? 'flex' : 'none';
$('addBtn').onclick = () => modal(true);
$('addCancel').onclick = () => modal(false);
$('addForm').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target), num = f.get('number').trim();
  e.target.number.classList.toggle('invalid', !num);
  if (!num) return;
  try {
    await addDoc(collection(db, COL), { number: num, series: f.get('series'), type: f.get('type'),
      mileage: Number(f.get('mileage')) || 0, defect: f.get('defect').trim(), status: 'new', createdAt: Date.now() });
    e.target.reset(); modal(false); toast('Профиль создан', 'success');
  } catch (err) { toast('Ошибка: ' + err.code, 'error'); }
};
</script>
</body>
</html>
