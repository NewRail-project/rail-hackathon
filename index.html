<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOCO PREDICT — NewRail</title>
<style>
:root{--kz8-blue:#1e5b9e;--kz8-blue-bright:#2a7fd4;--kz8-blue-dark:#143c6b;--kz8-cyan:#5bc8e8;--kz8-cyan-dim:#3a9fbf;--kz8-yellow:#f5c518;--kz8-yellow-dim:#c9a010;--kz8-black:#0a0d12;--kz8-dark:#0d1520;--kz8-panel:#1a2332;--bg:var(--kz8-dark);--panel:var(--kz8-panel);--panel-2:#202b3d;--border:#2a3a52;--border-2:#3a4553;--text:#e8eef5;--text-dim:#8a9bb0;--accent:var(--kz8-blue-bright);--success:#27ae60;--danger:#e74c3c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(circle at 20% 10%,rgba(42,127,212,.10),transparent 40%),radial-gradient(circle at 80% 90%,rgba(245,197,24,.05),transparent 40%)}
.hud-wrapper{max-width:1400px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
.brand-header{padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-header h1{font-size:22px;font-weight:600;letter-spacing:.5px;color:var(--text)}
.brand-header h1::before{content:'●';color:var(--kz8-yellow);margin-right:10px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{flex:1}
.train-nav{position:relative;display:flex;align-items:flex-end;gap:0;padding:14px 0 16px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.train-nav .wagon{position:relative;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;padding-bottom:22px;margin-right:-8px;color:var(--kz8-black);background:linear-gradient(180deg,#f0f4f8 0%,#e2e8ef 46%,var(--kz8-yellow) 46%,var(--kz8-yellow) 54%,#2a7fd4 54%,#1e5b9e 76%,#143c6b 100%);border:1px solid #0b2038;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;text-decoration:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);transition:all .25s ease;cursor:pointer;z-index:1;line-height:1}
.train-nav .wagon:hover{filter:brightness(1.15);transform:translateY(-2px);z-index:3}
.train-nav .wagon.active{filter:brightness(1.2) drop-shadow(0 0 12px rgba(245,197,24,.7));z-index:4;color:#0a1626;background:linear-gradient(180deg,var(--kz8-yellow) 0%,var(--kz8-yellow-dim) 100%)}
.train-head{position:relative;flex-shrink:0;width:120px;height:46px;margin-left:6px;clip-path:polygon(0% 20%,14% 4%,58% 4%,82% 8%,96% 32%,100% 55%,100% 100%,0% 100%);background:linear-gradient(180deg,#f0f4f8 0%,#e2e8ef 46%,var(--kz8-yellow) 46%,var(--kz8-yellow) 54%,var(--kz8-cyan) 54%,var(--kz8-cyan-dim) 68%,var(--kz8-blue) 68%,var(--kz8-blue-dark) 100%);filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));z-index:2}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 4px 24px rgba(42,127,212,.06)}
.card h2{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text)}
.card .subtitle{font-size:12px;color:var(--text-dim);margin-bottom:16px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kz8-yellow)}
.stat .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat .value{font-size:28px;font-weight:700;color:var(--text)}
.stat .value.accent{color:var(--kz8-blue-bright)}.stat .value.green{color:var(--success)}.stat .value.yellow{color:var(--kz8-yellow)}.stat .value.red{color:var(--danger)}
button,.btn{position:relative;background:linear-gradient(180deg,#2a3a52 0%,#1a2332 100%);color:var(--text);border:1px solid var(--border-2);border-bottom:2px solid #5a6575;padding:12px 22px;border-radius:6px;font-size:13px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:all .15s ease;font-family:inherit;text-decoration:none;display:inline-block;line-height:1}
button::before,.btn::before{content:'';position:absolute;top:1px;left:1px;right:1px;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);border-radius:5px 5px 0 0;pointer-events:none}
button:hover,.btn:hover{border-color:var(--kz8-blue-bright);box-shadow:0 0 12px rgba(42,127,212,.35)}
button:active,.btn:active{transform:translateY(1px);border-bottom-width:1px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
button.primary,.btn.primary{background:linear-gradient(180deg,var(--kz8-blue-bright) 0%,var(--kz8-blue) 100%);color:#fff;border-color:var(--kz8-blue-bright);border-bottom:2px solid #4a9eff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)}
button.primary:hover{box-shadow:0 0 20px rgba(42,127,212,.6)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--kz8-blue-bright);box-shadow:0 0 0 3px rgba(42,127,212,.15)}
.auth-card{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--kz8-yellow);border-radius:12px;padding:24px;box-shadow:0 4px 24px rgba(42,127,212,.12)}
.auth-card h2{margin-bottom:16px;color:var(--kz8-blue-bright);font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.auth-card button{width:100%}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel-2);border:1px solid var(--border-2);border-radius:20px;font-size:12px;color:var(--text-dim)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.toolbar input[type="search"],.toolbar input[type="text"]{flex:1 1 220px;width:auto}
.toolbar select{flex:0 1 180px;width:auto}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kanban-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:400px}
.kanban-col h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.kanban-item{background:var(--panel-2);border:1px solid var(--border-2);border-radius:8px;padding:12px;margin-bottom:10px}
.kanban-item .id{font-weight:600;color:var(--kz8-blue-bright);font-size:14px}
.kanban-item .meta{font-size:12px;color:var(--text-dim);margin-top:6px}
.kanban-item .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--border-2);border-radius:12px;padding:24px;max-width:480px;width:100%}
.modal-content h2{margin-bottom:16px;color:var(--kz8-blue-bright)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:10px 18px;background:rgba(13,21,32,.95);border:1px solid var(--kz8-cyan);border-left:4px solid var(--kz8-yellow);border-radius:8px;color:var(--text);font-size:13px;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.qr-box{display:inline-block;padding:12px;background:#fff;border-radius:12px;border:3px solid var(--kz8-yellow)}
.qr-wrap{text-align:center}
.qr-wrap .code{margin-top:12px;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--kz8-yellow)}
@media(max-width:768px){.kanban{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="hud-wrapper">
  <header class="brand-header">
    <h1>NewRail</h1>
    <div id="userBox" style="display:none">
      <span class="user-chip" id="userEmail"></span>
      <button id="devLogout">Выйти</button>
    </div>
  </header>

  <!-- ВХОД -->
  <section id="authView" class="auth-card">
    <h2>Вход</h2>
    <div class="field"><label for="devLogin">Логин</label><input id="devLogin" autocomplete="username"></div>
    <div class="field"><label for="devPass">Пароль</label><input id="devPass" type="password" autocomplete="current-password"></div>
    <button class="primary" id="devSubmit">Войти</button>
  </section>

  <!-- ПРИЛОЖЕНИЕ -->
  <main id="appView" style="display:none">
    <!-- Навигация в виде состава -->
    <nav class="train-nav">
      <a class="wagon active" data-view="tasks">Задачи</a>
      <a class="wagon" data-view="passport" id="passportNavBtn">Паспорт</a>
      <a class="wagon" data-view="planner" id="plannerNavBtn">График ТО</a>
      <a class="wagon" data-view="repair" id="repairNavBtn">Ремонт</a>
      <a class="wagon" data-view="dashboard" id="dashboardNavBtn">Депо</a>
      <a class="wagon" id="qrBtn">QR</a>
      <div class="train-head"></div>
    </nav>

    <!-- Динамический контейнер контента -->
    <div id="main-content-view">
      <div class="grid grid-3" style="margin-bottom:16px">
        <div class="stat"><div class="label">Ожидают</div><div class="value red" id="cWaiting">0</div></div>
        <div class="stat"><div class="label">В работе</div><div class="value yellow" id="cProgress">0</div></div>
        <div class="stat"><div class="label">Готово</div><div class="value green" id="cDone">0</div></div>
      </div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Поиск…">
        <select id="filter">
          <option value="">Все статусы</option>
          <option value="waiting">Ожидают</option>
          <option value="progress">В работе</option>
          <option value="done">Готово</option>
        </select>
        <button class="primary" id="addBtn">+ Добавить</button>
      </div>

      <div class="kanban">
        <div class="kanban-col"><h3>Ожидают</h3><div id="col-waiting"></div></div>
        <div class="kanban-col"><h3>В работе</h3><div id="col-progress"></div></div>
        <div class="kanban-col"><h3>Готово</h3><div id="col-done"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- МОДАЛКА: добавить -->
<div class="modal" id="addModal">
  <form class="modal-content" id="addForm" novalidate>
    <h2>Новая запись</h2>
    <div class="field"><label>Название</label><input name="title" required></div>
    <div class="field"><label>Описание</label><input name="meta" required></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button type="submit" class="primary">Сохранить</button>
      <button type="button" id="addCancel">Отмена</button>
    </div>
  </form>
</div>

<!-- МОДАЛКА: QR -->
<div class="modal" id="qrModal">
  <div class="modal-content qr-wrap">
    <h2>Присоединиться</h2>
    <div class="qr-box" id="qr"></div>
    <div class="code" id="qrCode"></div>
    <button id="qrClose" style="margin-top:16px">Закрыть</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoD1pNfA_cfiqCUwAKT7XHfNLOsedmhdU",
  authDomain: "rail-hackathon-db.firebaseapp.com",
  projectId: "rail-hackathon-db",
  storageBucket: "rail-hackathon-db.firebasestorage.app",
  messagingSenderId: "257494735942",
  appId: "1:257494735942:web:1aa10dcb7f25c83fcf3e47"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const COL = "tasks";
const $ = id => document.getElementById(id);

const toggleModal = (id, state) => { const m = $(id); if (m) m.classList.toggle('open', state); };
function showToast(text, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2600);
}
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = vol || 0.15;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('devSubmit').onclick = () => {
  const login = $('devLogin').value.trim().toLowerCase();
  const email = login ? (login.includes('@') ? login : login + '@corequiz.local') : 'core.singl@corequiz.local';
  signInWithEmailAndPassword(auth, email, $('devPass').value.trim())
    .then(() => { beep(880, .15); showToast('Вход выполнен', 'success'); })
    .catch(err => { beep(200, .3, 'square'); showToast('Ошибка: ' + err.message, 'error'); });
};
$('devLogout').onclick = () => signOut(auth).then(() => showToast('Вы вышли'));

let unsub = null, items = [];
onAuthStateChanged(auth, user => {
  $('authView').style.display = user ? 'none' : '';
  $('appView').style.display = user ? '' : 'none';
  $('userBox').style.display = user ? '' : 'none';
  if (user) {
    $('userEmail').textContent = user.email.split('@')[0];
    unsub = onSnapshot(collection(db, COL), snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
  } else if (unsub) { unsub(); unsub = null; items = []; }
});

const NEXT = { waiting: 'start', progress: 'done' };
const LABEL = { start: 'В работу', done: 'Готово' };

function render() {
  const container = $('main-content-view');
  // Проверяем какая вкладка активна
  const activeWagon = document.querySelector('.train-nav .wagon.active');
  const view = activeWagon ? activeWagon.getAttribute('data-view') : 'tasks';

  if (view === 'passport') {
    container.innerHTML = `
      <div class="card">
        <h2>Цифровой паспорт локомотива КЗ8А</h2>
        <div class="subtitle">Учет пробега, характеристик и телеметрии узлов</div>
        <p style="margin-bottom:10px"><strong>Текущий пробег:</strong> 142 500 км</p>
        <p style="margin-bottom:10px"><strong>Депо приписки:</strong> ТД-20</p>
        <p style="margin-bottom:15px"><strong>Температура подшипников:</strong> 78 °C (Норма)</p>
        <button class="primary" onclick="alert('Пробег защищен от скручивания')">Обновить пробег</button>
      </div>`;
    return;
  }
  if (view === 'planner') {
    container.innerHTML = `
      <div class="card">
        <h2>График ТО (ТО-1 — ТО-8)</h2>
        <div class="subtitle">Регламент обслуживания тягового подвижного состава</div>
        <table>
          <tr><th>Вид ТО</th><th>Наименование</th><th>Интервал</th><th>Статус</th></tr>
          <tr><td>ТО-1</td><td>Ежесменный осмотр</td><td>1 000 км</td><td><span style="color:var(--success)">По плану</span></td></tr>
          <tr><td>ТО-2</td><td>ТО при отстое</td><td>5 000 км</td><td><span style="color:var(--success)">По плану</span></td></tr>
          <tr><td>ТО-3</td><td>Периодическое ТО</td><td>25 000 км</td><td><span style="color:var(--kz8-yellow)">Скоро</span></td></tr>
        </table>
      </div>`;
    return;
  }
  if (view === 'repair') {
    container.innerHTML = `
      <div class="card">
        <h2>Журнал ремонта и ТУ-152</h2>
        <div class="subtitle">Управление этапами и заявками депо</div>
        <p>Активных ремонтных случаев: <strong>0</strong></p>
      </div>`;
    return;
  }
  if (view === 'dashboard') {
    container.innerHTML = `
      <div class="card">
        <h2>Личный кабинет депо и файлы</h2>
        <div class="subtitle">Загрузка актов осмотра и диагностических отчетов</div>
        <input type="file" style="margin-bottom:15px">
        <button class="primary">Загрузить документ</button>
      </div>`;
    return;
  }

  // Отрендерить задачи (tasks)
  container.innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="stat"><div class="label">Ожидают</div><div class="value red" id="cWaiting">0</div></div>
      <div class="stat"><div class="label">В работе</div><div class="value yellow" id="cProgress">0</div></div>
      <div class="stat"><div class="label">Готово</div><div class="value green" id="cDone">0</div></div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Поиск…">
      <select id="filter">
        <option value="">Все статусы</option>
        <option value="waiting">Ожидают</option>
        <option value="progress">В работе</option>
        <option value="done">Готово</option>
      </select>
      <button class="primary" id="addBtn">+ Добавить</button>
    </div>
    <div class="kanban">
      <div class="kanban-col"><h3>Ожидают</h3><div id="col-waiting"></div></div>
      <div class="kanban-col"><h3>В работе</h3><div id="col-progress"></div></div>
      <div class="kanban-col"><h3>Готово</h3><div id="col-done"></div></div>
    </div>
  `;

  let list = items;
  const q = $('search')?.value.trim() \vert{}\vert{} '', f =$('filter')?.value || '';
  if (q) list = list.filter(i => String(i.title||'').toLowerCase().includes(q.toLowerCase()) || String(i.meta||'').toLowerCase().includes(q.toLowerCase()));
  if (f) list = list.filter(i => i.status === f);

  for (const s of ['waiting', 'progress', 'done']) {
    const rows = list.filter(i => i.status === s);
    const col = $('col-' + s);
    if (col) {
      col.innerHTML = rows.length ? rows.map(i => `
        <div class="kanban-item">
          <div class="id">${esc(i.title)}</div>
          <div class="meta">${esc(i.meta)}</div>
          <div class="actions">
            ${NEXT[s] ? `<button data-action="${NEXT[s]}" data-id="${i.id}">${LABEL[NEXT[s]]}</button>` : ''}
            <button data-action="remove" data-id="${i.id}">Удалить</button>
          </div>
        </div>`).
